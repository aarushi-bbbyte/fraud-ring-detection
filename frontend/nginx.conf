server {
  listen 80;
  root /usr/share/nginx/html;

  # The API is reached through /api so the app works with relative URLs.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_read_timeout 1h;
    # Server-sent events must reach the browser as they're produced.
    proxy_buffering off;
    proxy_cache off;
  }

  # Client-side routes (e.g. /rings/ring-1) all serve the app.
  location / {
    try_files $uri /index.html;
  }
}
