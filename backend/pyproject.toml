[project]
name = "fraudring"
version = "0.1.0"
description = "Fraud-ring detection over payment networks with Neo4j"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=6.0,<7",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fraudring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
