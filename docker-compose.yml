services:
  neo4j:
    image: neo4j:5.26-community
    container_name: fraud-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Downloads the Graph Data Science plugin matching this Neo4j version on first start.
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      # Sized for a ~4 GB Docker VM, leaving room for neo4j-test. The hot store
      # (relationships + properties) is ~1.3 GB for HI-Small, so a little more
      # page cache helps if you have the RAM. Going past the VM's memory causes
      # swapping, which is far worse than cache misses. Override in .env.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-1g}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1200m}
      # The bulk loader writes 10k-row batches; a larger transaction memory cap avoids spurious failures.
      NEO4J_db_memory_transaction_total_max: 1g
    volumes:
      - neo4j-data:/data
      - neo4j-plugins:/plugins
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Throwaway instance for pytest: tests wipe it freely, so they never touch the
  # loaded dataset. Never run it alongside `neo4j`: together they exceed a 4 GB
  # Docker VM. scripts/db-tests.sh stops the main database first.
  neo4j-test:
    image: neo4j:5.26-community
    container_name: fraud-neo4j-test
    profiles: ["test"]
    restart: "no"
    ports:
      - "${NEO4J_TEST_HTTP_PORT:-7475}:7474"
      - "${NEO4J_TEST_BOLT_PORT:-7688}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      # Test graphs have a few dozen nodes.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 32m
    volumes:
      - neo4j-test-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  neo4j-data:
  neo4j-plugins:
  neo4j-logs:
  neo4j-test-plugins:
